<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能问答助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #eef2f7; height: 100vh; display: flex; flex-direction: column;
  }
  header {
    background: #1d5fa8; color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  header .logo { width: 34px; height: 34px; border-radius: 50%; background: #fff;
    color: #1d5fa8; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  header h1 { font-size: 17px; font-weight: 600; }
  header .status { margin-left: auto; font-size: 12px; opacity: .85; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .chat { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; gap: 10px; }
  .msg .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: #1d5fa8; color: #fff; }
  .msg.bot .avatar { background: #fff; color: #1d5fa8; border: 1px solid #d8e1ec; }
  .msg .bubble { max-width: 72%; padding: 10px 14px; border-radius: 12px;
    font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: #1d5fa8; color: #fff; border-top-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; color: #2b2f36; border-top-left-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .msg.bot.error .bubble { background: #fdecec; color: #a32d2d; }
  footer { padding: 14px 20px; background: #fff; border-top: 1px solid #e3e8ef; }
  .input-row { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .input-row textarea {
    flex: 1; resize: none; padding: 11px 14px; border: 1px solid #d0d8e3; border-radius: 10px;
    font-size: 14px; font-family: inherit; height: 48px; outline: none;
  }
  .input-row textarea:focus { border-color: #1d5fa8; }
  .input-row button {
    padding: 0 26px; border: none; border-radius: 10px; background: #1d5fa8; color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .input-row button:disabled { background: #9bb8d4; cursor: not-allowed; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 11.5px; color: #98a2b3; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="logo">AI</div>
  <h1>智能问答助手</h1>
  <span class="status" id="status">检查服务中…</span>
</header>
<main>
  <div class="chat" id="chat">
    <div class="msg bot">
      <div class="avatar">AI</div>
      <div class="bubble">你好，我是你的智能问答助手。有什么想聊的，直接发消息给我吧。</div>
    </div>
  </div>
</main>
<footer>
  <div class="input-row">
    <textarea id="input" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">内容由大模型生成，请注意甄别准确性</div>
</footer>

<script>
const chatBox = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
let history = [];   // [{role:'user'|'assistant', content:'…'}]
let busy = false;

// 服务健康检查
fetch('/api/health').then(r => r.json()).then(d => {
  statusEl.textContent = d.key_loaded
    ? `模型：${d.model} · 已就绪`
    : '未配置 API_KEY（先在 .env 填写并重启）';
  statusEl.style.color = d.key_loaded ? '#bfe3c9' : '#ffd9a8';
});

function addMsg(role, text, isError) {
  const div = document.createElement('div');
  div.className = 'msg ' + role + (isError ? ' error' : '');
  div.innerHTML = role === 'user'
    ? '<div class="avatar">我</div><div class="bubble"></div>'
    : '<div class="avatar">AI</div><div class="bubble"></div>';
  div.querySelector('.bubble').textContent = text;
  chatBox.appendChild(div);
  chatBox.parentElement.scrollTop = chatBox.parentElement.scrollHeight;
  return div.querySelector('.bubble');
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  busy = true; sendBtn.disabled = true; input.value = '';

  addMsg('user', text);
  const bubble = addMsg('bot', '');
  let reply = '';

  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, history: history })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: '请求失败' }));
      throw new Error(err.error || ('HTTP ' + res.status));
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n\n');
      buf = lines.pop();
      for (const line of lines) {
        const data = line.replace(/^data: /, '').trim();
        if (!data || data === '[DONE]') continue;
        try {
          const obj = JSON.parse(data);
          if (obj.error) throw new Error(obj.error);
          if (obj.content) {
            reply += obj.content;
            bubble.textContent = reply;
            chatBox.parentElement.scrollTop = chatBox.parentElement.scrollHeight;
          }
        } catch (e) {
          if (e.message && !e.message.startsWith('Unexpected')) throw e;
        }
      }
    }
    if (reply) {
      history.push({ role: 'user', content: text });
      history.push({ role: 'assistant', content: reply });
    }
  } catch (e) {
    bubble.textContent = '出错了：' + e.message;
    bubble.parentElement.classList.add('error');
  } finally {
    busy = false; sendBtn.disabled = false; input.focus();
  }
}

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
